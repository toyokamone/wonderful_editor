databases:
  - name: postgresql-wonderful-editor
    databaseName: wonderful_editor_production
    user: wonderful_editor_user
    plan: free

services:
  - type: web
    name: wonderful-editor
    env: ruby
    region: singapore
    plan: free
    branch: main
    numInstances: 1
    healthCheckPath: /
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: postgresql-wonderful-editor
          property: connectionString
    autoDeploy: false
